<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Trip – Wayfare</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<nav class="topbar">
  <a href="index.html" class="topbar-logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Wayfare
  </a>
  <nav class="topbar-nav">
    <a href="planner.html">Plan a trip</a>
  </nav>
</nav>

<div class="page">
  <div class="flex items-center gap-2 mb-2">
    <h1 id="trip-title">Shared Trip</h1>
    <span id="role-display" class="role-badge viewer"></span>
  </div>

  <div class="grid-2" style="align-items:start;gap:1.5rem">
    <div>
      <div id="map" style="height:280px;margin-bottom:1rem"></div>
      <div id="itinerary-container"></div>
    </div>
    <div id="collab-panel"></div>
  </div>
</div>

<footer class="app-footer">Powered by <strong>IBM Granite</strong></footer>

<script type="module">
  import { api } from './js/api.js';
  import { renderItinerary } from './js/itinerary.js';
  import { initMap, plotItinerary } from './js/map.js';
  import { SharePanel } from './js/share.js';

  if (!localStorage.getItem('wayfare_token')) {
    api.devLogin().then(d => d?.token && api.setToken(d.token)).catch(() => {});
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('token');

  if (!token) {
    document.getElementById('trip-title').textContent = 'Invalid share link';
  } else {
    api.getSharedTrip(token).then((data) => {
      const itinerary = data.trip;
      document.getElementById('trip-title').textContent = itinerary.title || 'Shared Trip';
      const roleEl = document.getElementById('role-display');
      roleEl.textContent = data.role;
      roleEl.className = `role-badge ${data.role}`;

      renderItinerary(itinerary, document.getElementById('itinerary-container'));
      initMap('map');
      plotItinerary(itinerary);

      // Collab panel
      const sp = new SharePanel(document.getElementById('collab-panel'), itinerary.trip_id, token);
      sp.loadSharedData(data);
      sp.startPolling();
    }).catch((err) => {
      document.getElementById('trip-title').textContent = 'Error loading trip';
      document.getElementById('itinerary-container').innerHTML = `<p class="text-muted">${err.message}</p>`;
    });
  }
</script>
</body>
</html>
