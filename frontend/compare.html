<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Prices – Wayfare</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<nav class="topbar">
  <a href="index.html" class="topbar-logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Wayfare
  </a>
  <nav class="topbar-nav">
    <a href="index.html">Home</a>
    <a href="planner.html">Plan</a>
    <a href="compare.html" class="active">Compare</a>
  </nav>
</nav>

<div class="page">
  <h1 class="mb-2">Compare prices</h1>
  <p class="text-muted text-sm mb-2">Compare trains, flights, buses, and stays. Best value powered by IBM Granite.</p>

  <div class="card mb-2">
    <div class="grid-2" style="gap:0.75rem;align-items:end">
      <div>
        <label class="text-sm fw-medium mb-1" style="display:block">Origin</label>
        <input id="origin-input" placeholder="e.g. Delhi" value="Delhi">
      </div>
      <div>
        <label class="text-sm fw-medium mb-1" style="display:block">Destination</label>
        <input id="dest-input" placeholder="e.g. Mumbai" value="Mumbai">
      </div>
      <div>
        <label class="text-sm fw-medium mb-1" style="display:block">Date</label>
        <input id="date-input" type="date">
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="btn-primary" id="compare-btn" style="width:100%">Compare →</button>
      </div>
    </div>
  </div>

  <div id="compare-results"></div>
</div>

<footer class="app-footer">Powered by <strong>IBM Granite</strong></footer>

<script type="module">
  import { api } from './js/api.js';
  import { renderCompareView } from './js/compare.js';

  if (!localStorage.getItem('wayfare_token')) {
    api.devLogin().then(d => d?.token && api.setToken(d.token)).catch(() => {});
  }

  document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

  document.getElementById('compare-btn').addEventListener('click', () => {
    const origin = document.getElementById('origin-input').value.trim() || 'Delhi';
    const dest = document.getElementById('dest-input').value.trim() || 'Mumbai';
    const date = document.getElementById('date-input').value;
    renderCompareView(document.getElementById('compare-results'), origin, dest, date);
  });

  // Auto-load on page open
  renderCompareView(document.getElementById('compare-results'), 'Delhi', 'Mumbai', '');
</script>
</body>
</html>
